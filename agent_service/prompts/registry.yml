# LawAgent Prompt 索引
# 统一管理所有 LLM Prompt 的元信息：key → md 文件 + 描述 + 模板变量
# md 文件位于同目录的 md/ 子目录下，由 loader.py 启动时一次性加载到内存

version: 1

# System Prompt：纯文本，无占位符，通过 get_prompt(name) 读取
system_prompts:
