# User Prompt 模板：含 {name} 命名占位符，通过 format_prompt(name, **kwargs) 填充
user_templates:
  base_reason_user:
    file: md/base_reason_user.md
    description: BaseAgent 通用法律问答 user 模板
    variables: [query, history_summary, memory, context_text, risk_level, tool_calls, retry_hint]
  contract_review_user:
    file: md/contract_review_user.md
    description: 合同审查专用 user 模板，含合同原文与规则引擎结果
    variables: [review_dimensions, contract_text, context_text, tool_calls]
  retry_hint:
    file: md/retry_hint.md
    description: 引用校验失败时追加到 user prompt 的修正提示
    variables: [reasons]
