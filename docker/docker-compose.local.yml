# 本文件为 Windows 本地开发补充 MySQL 与 Redis；与仓库原 compose 文件叠加使用。
services:
  mysql:
    image: mysql:8.4
    container_name: lawagent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lawrag}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: lawagent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9
    container_name: lawagent-embedding
    restart: unless-stopped
    command:
      - --model-id
      - /model
      - --port
      - "80"
      - --max-client-batch-size
      - "100"
    ports:
      - "8080:80"
    volumes:
      - ../storage/models/bge-large-zh-v1.5:/model:ro
    shm_size: "1gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 5m

volumes:
  mysql-data:
  redis-data:
